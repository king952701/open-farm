<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>牧野田园 · 开放式休闲生存建造</title>
<style>
/* ===== 科幻皮肤：深空玻璃 + 青色发光 + 切角 =====
   全站 23 个面板 / 全部 HUD / 图标方块都从下面这组变量取色，改这里即整站换肤 */
:root{
  --glass:linear-gradient(165deg,rgba(12,26,42,.92),rgba(6,15,24,.88));
  --glass2:linear-gradient(165deg,rgba(14,30,46,.80),rgba(6,15,24,.74));
  --ink:#dff1ff; --dim:#8fb0c4;
  --green:#3fe0c8; --green2:#5ad2ff;   /* 主强调青 · 次强调亮蓝（原来的「绿」语义全部迁到青） */
  --gold:#ffd45a; --blue:#5ad2ff; --red:#ff6b7a;
  --bd:rgba(90,210,255,.28);
  --sh:0 6px 22px rgba(0,12,24,.55);
  /* 科幻专用 */
  --surf:rgba(16,34,52,.55);           /* 卡片 / 列表行底 */
  --hi:rgba(90,210,255,.14);           /* 悬停高亮 */
  --btnBg:rgba(18,38,58,.90);          /* 按钮底 */
  --glow:0 0 14px rgba(90,210,255,.22);/* 外发光 */
  --inglow:inset 0 0 0 1px rgba(90,210,255,.10);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#050b12}   /* 深空底色：加载与切场景时不露白 */
body{
  font:14px/1.6 "PingFang SC","Microsoft YaHei","Hiragino Sans GB","Source Han Sans SC",system-ui,sans-serif;
  color:var(--ink); user-select:none; -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none;
}
/* 例外：输入框 / 文本域必须能正常选字（聊天、改名等），不能被上面的 none 连坐 */
input,textarea,select{user-select:text;-webkit-user-select:text;-moz-user-select:text}
/* 图片与链接一律不可拖、长按不弹系统菜单（图片多由聊天的截图 / 贴图插入） */
img,a{-webkit-user-drag:none;user-drag:none;-webkit-touch-callout:none}
#cv{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
/* 安全区：刘海屏 / 灵动岛 / Home 条 / 挖孔屏 —— absolute 子元素随 padding 整体内缩 */
#ui,#panel{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#ui{position:absolute;inset:0;pointer-events:none;z-index:5;touch-action:none}
#ui button,#ui input,#ui .card,#ui .item,#ui .slot,#ui .seed,#ui .panel,#ui .mmwrap{pointer-events:auto}
/* 触摸端：画布与 HUD 不交给浏览器做默认手势（ scroll 的容器例外：
   手机上 #corner 按钮列是可滚动的，得放行 pan-y；面板 .pbody 在 #panel 里不受影响） */
html.mobile #corner{touch-action:pan-y}

/* ---------- 顶部左：时钟 / 状态 ---------- */
#topbar{position:absolute;left:14px;top:14px;min-width:236px;
  background:var(--glass);border:1px solid var(--bd);border-radius:4px;box-shadow:var(--sh),var(--glow);
  padding:10px 12px;backdrop-filter:blur(8px);
  clip-path:polygon(0 12px,12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%)}
#clock{font-size:14px;font-weight:600;letter-spacing:1px;color:var(--ink);text-shadow:0 0 10px rgba(90,210,255,.35)}
#clock b{color:var(--green2)}
#vitals{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.vrow{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim)}
.vrow span{width:30px;flex:0 0 30px}
.vrow .vbar{flex:1;height:8px;border-radius:2px;background:rgba(90,210,255,.12);overflow:hidden;box-shadow:inset 0 0 6px rgba(0,0,0,.5)}
.vrow .vbar i{display:block;height:100%;border-radius:2px;transition:width .2s;box-shadow:0 0 8px currentColor}
.vrow em{width:38px;text-align:right;font-style:normal;font-size:11px;color:var(--ink);opacity:.85;font-variant-numeric:tabular-nums}

/* ---------- 顶部右：小地图 ---------- */
#minimap{position:absolute;right:14px;top:14px;padding:8px;border-radius:4px;
  background:var(--glass);border:1px solid var(--bd);box-shadow:var(--sh),var(--glow);backdrop-filter:blur(8px);
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
#mm{display:block;width:180px;height:180px;border-radius:3px;background:#8fb255;
  box-shadow:inset 0 0 22px rgba(0,20,40,.55)}
#mm-label{font-size:11px;color:var(--green2);text-align:center;margin-top:5px;letter-spacing:3px;text-shadow:0 0 8px rgba(90,210,255,.4)}

/* ---------- 右下角按钮 ---------- */
#corner{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.cbtn{pointer-events:auto;cursor:pointer;background:var(--glass);border:1px solid var(--bd);
  border-radius:3px;box-shadow:var(--sh);padding:8px 13px;font-size:13px;color:var(--ink);
  backdrop-filter:blur(8px);transition:.15s;min-width:96px;text-align:center;
  letter-spacing:.5px;clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%)}
.cbtn:hover{background:var(--hi);border-color:var(--green);box-shadow:var(--sh),var(--glow);transform:translateY(-1px)}
.cbtn b{color:var(--green2);font-weight:700;text-shadow:0 0 8px rgba(90,210,255,.5)}

/* ---------- 系统菜单宫格：原 15 个竖排按钮收纳于此（M3E 设计稿落地） ---------- */
.sys-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sys-tile{cursor:pointer;background:var(--surf);border:1px solid var(--bd);border-radius:3px;
  padding:9px 12px;display:flex;align-items:center;gap:10px;transition:.15s;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%)}
.sys-tile:hover{background:var(--hi);border-color:var(--green);box-shadow:var(--glow)}
.sys-tile .ic{width:34px;height:34px;flex:0 0 34px;
  background:linear-gradient(160deg,rgba(90,210,255,.30),rgba(63,224,200,.16));
  color:#c9f6ff;display:grid;place-items:center;font-size:16px;font-weight:700;
  border:1px solid rgba(90,210,255,.45);box-shadow:0 0 12px rgba(90,210,255,.28);
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.sys-tile .tn{font-size:13.5px;color:var(--ink);font-weight:600}
.sys-tile .tk{margin-left:auto;font-size:11px;color:var(--green2);border:1px solid var(--bd);
  border-radius:2px;padding:1px 6px;font-variant-numeric:tabular-nums;text-shadow:0 0 8px rgba(90,210,255,.5)}

/* ---------- 底部：提示 / 进度 / 快捷栏 ---------- */
#prompt{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);
  background:linear-gradient(180deg,rgba(10,26,42,.92),rgba(6,16,26,.9));color:#e6f7ff;
  padding:8px 18px;border-radius:3px;border:1px solid var(--bd);
  font-size:14px;letter-spacing:.5px;box-shadow:var(--sh),var(--glow);display:none;white-space:nowrap;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
/* ---------- 靠近资源：资源信息卡 ---------- */
#nodeinfo{position:absolute;left:14px;bottom:118px;width:214px;display:none;pointer-events:none;z-index:40;
  background:linear-gradient(165deg,rgba(12,28,44,.90),rgba(6,16,26,.88));
  border:1px solid var(--bd);border-radius:3px;
  padding:8px 11px;box-shadow:var(--sh),var(--glow);backdrop-filter:blur(6px);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%)}
#nodeinfo .ni-h{font-size:13px;font-weight:700;color:#8ff0ff;display:flex;justify-content:space-between;align-items:center;gap:6px;text-shadow:0 0 10px rgba(90,210,255,.45)}
#nodeinfo .ni-h span{font-size:11px;font-weight:400;color:#cfe0cc;background:rgba(255,255,255,.10);border-radius:6px;padding:1px 6px}
#nodeinfo .ni-r{margin-top:5px;font-size:12px;color:#e8f0e4}
#nodeinfo .ni-r b{color:#fff}
#nodeinfo .ni-r b.ok{color:#8fd66f}
#nodeinfo .ni-r b.no{color:#ff8a7a}
#nodeinfo .ni-d{margin-top:3px;font-size:11px;color:var(--dim);line-height:1.35}

#progress{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);width:280px;
  background:linear-gradient(165deg,rgba(12,28,44,.92),rgba(6,16,26,.9));border:1px solid var(--bd);
  border-radius:3px;padding:6px 8px;display:none;box-shadow:var(--glow);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%)}
#progress-txt{display:block;font-size:11px;color:#bfe9ff;text-align:center;margin-bottom:4px;letter-spacing:1px}
#pbar-wrap{height:9px;background:rgba(90,210,255,.14);border-radius:2px;overflow:hidden}
#progress-bar{height:100%;width:0%;background:linear-gradient(90deg,#5ad2ff,#3fe0c8);border-radius:2px;
  box-shadow:0 0 10px rgba(90,210,255,.6)}

#hotbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:7px}
.slot{pointer-events:auto;cursor:pointer;width:62px;height:60px;border-radius:3px;
  background:var(--glass2);border:1px solid var(--bd);box-shadow:var(--sh);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  backdrop-filter:blur(6px);transition:.15s;position:relative;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%)}
.slot b{font-size:20px;line-height:1;color:var(--green2);font-weight:600;text-shadow:0 0 10px rgba(90,210,255,.5)}
.slot .nm{font-size:10px;color:var(--dim)}
.slot i{position:absolute;top:2px;right:5px;font-size:10px;font-style:normal;color:#7fa8c0;font-variant-numeric:tabular-nums}
.slot:hover{background:var(--hi);border-color:var(--green)}
.slot.on{background:linear-gradient(180deg,rgba(63,224,200,.28),rgba(90,210,255,.14));border-color:var(--green);
  box-shadow:0 0 0 1px rgba(63,224,200,.55),var(--glow),var(--sh)}
.slot.on b{color:#a8fff2}

#seedbar{position:absolute;left:50%;bottom:80px;transform:translateX(-50%);display:none;gap:6px}

/* ---------- 技能条：右下三槽。[Q] / [E] / 鼠标右键，触摸端直接点按钮 ----------
   功能按钮已收纳进「系统菜单」（右下角唯一一个 .cbtn），技能条与它并排不拥挤 */
#skillbar{position:absolute;right:calc(122px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:9px}
.sb{pointer-events:auto;cursor:pointer;width:84px;min-height:52px;border-radius:3px;
  background:var(--glass);border:1px solid var(--bd);box-shadow:var(--sh);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;overflow:hidden;position:relative;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%)}
.sb b{font-size:13px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(30,50,30,.7)}
.sb span{font-size:10px;color:#e8f0e4;font-weight:600;text-shadow:0 1px 2px rgba(30,50,30,.55)}
/* 冷却遮罩自上而下退去；未解锁灰显；就绪时一圈绿光（可点提示，非常驻高亮） */
.sb i{position:absolute;left:0;top:0;width:100%;height:0%;background:rgba(4,12,22,.62);transition:height .1s linear}
.sb.off{opacity:.45}
.sb.off b::after{content:'🔒';font-size:9px;margin-left:2px}
.sb:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.sb[data-ok="true"]{border-color:var(--green)}
@media (max-width:640px){.sb{width:70px;min-height:46px}.sb b{font-size:12px}
  #skillbar{right:calc(110px + env(safe-area-inset-right))}}
.seed{pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:5px;
  background:var(--glass);border:1px solid var(--bd);border-radius:3px;padding:4px 10px;font-size:12px;box-shadow:var(--sh);
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.seed .dot{width:9px;height:9px;border-radius:2px;display:inline-block;box-shadow:0 0 8px currentColor}
.seed b{font-size:12px;color:var(--green2);margin-left:2px}
.seed.on{background:var(--hi);border-color:var(--green);box-shadow:0 0 0 1px rgba(63,224,200,.5),var(--glow)}

/* ---------- 吐司 / 浮动文字 ---------- */
#toasts{position:absolute;left:50%;top:16px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{background:linear-gradient(165deg,rgba(12,28,44,.94),rgba(6,16,26,.92));color:#e6f7ff;
  border:1px solid var(--bd);padding:7px 15px;border-radius:3px;font-size:13px;letter-spacing:.5px;
  box-shadow:var(--sh),var(--glow);transition:.35s;white-space:nowrap;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.toast.ok{background:linear-gradient(165deg,rgba(12,52,48,.94),rgba(6,24,22,.92));border-color:rgba(63,224,200,.5)}
.toast.bad{background:linear-gradient(165deg,rgba(58,18,28,.94),rgba(28,8,14,.92));border-color:rgba(255,107,122,.5)}
.toast.info{background:linear-gradient(165deg,rgba(12,34,56,.94),rgba(6,18,30,.92));border-color:rgba(90,210,255,.5)}
.float-txt{position:absolute;transform:translate(-50%,-50%);font-size:14px;font-weight:700;
  text-shadow:0 2px 6px rgba(0,0,0,.6);pointer-events:none;z-index:6}

/* ---------- 面板 ---------- */
#panel{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(2,8,16,.55);backdrop-filter:blur(3px);z-index:20}
/* 科幻面板：深空玻璃 + 青色内辉光 + 八边形切角（.panel 是全站 23 个面板的唯一骨架） */
.panel{width:min(760px,92vw);max-height:82vh;overflow:auto;background:var(--glass);
  border:1px solid var(--bd);border-radius:3px;box-shadow:0 18px 50px rgba(0,10,20,.6),var(--glow),var(--inglow);
  clip-path:polygon(0 16px,16px 0,calc(100% - 16px) 0,100% 16px,100% calc(100% - 16px),calc(100% - 16px) 100%,16px 100%,0 calc(100% - 16px))}
/* 标题栏：左侧青色能量条 + 底部扫描线，光标仍是 move（可拖拽） */
.phead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--bd);
  position:sticky;top:0;background:linear-gradient(90deg,rgba(63,224,200,.16),rgba(10,24,38,.96) 42%);
  box-shadow:inset 3px 0 0 var(--green),0 6px 18px rgba(0,10,20,.5);border-radius:3px 3px 0 0}
.phead h3{font-size:16px;font-weight:700;color:#e6f7ff;letter-spacing:1px;text-shadow:0 0 12px rgba(90,210,255,.45)}
.phead span{font-size:12px;color:var(--dim);flex:1}
.phead .close{cursor:pointer;width:26px;height:26px;border-radius:2px;display:grid;place-items:center;
  background:rgba(90,210,255,.10);border:1px solid var(--bd);font-size:13px;color:var(--dim);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%)}
.phead .close:hover{background:rgba(255,107,122,.18);border-color:var(--red);color:var(--red)}
.pbody{padding:14px 18px 18px}
/* ---------- 面板拉伸把手：右缘 / 底缘 / 右下角，指针事件统一鼠标+触摸+笔 ---------- */
.prs{position:absolute;z-index:6;touch-action:none}
.prs-e{top:0;right:0;width:16px;height:100%;cursor:ew-resize}
.prs-s{left:0;bottom:0;width:100%;height:16px;cursor:ns-resize}
.prs-se{right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize}
.prs i{position:absolute;right:4px;bottom:4px;width:11px;height:11px;pointer-events:none;
  border-right:2px solid rgba(60,90,60,.4);border-bottom:2px solid rgba(60,90,60,.4);border-radius:0 0 4px 0}
.prs:focus-visible{outline:2px solid var(--green);outline-offset:-2px}
.pcat{font-size:12px;color:var(--green2);font-weight:700;margin:12px 0 8px;letter-spacing:1px}
.pcat:first-child{margin-top:0}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.card{cursor:pointer;background:var(--surf);border:1px solid var(--bd);border-radius:3px;
  padding:10px 12px;transition:.15s;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%)}
.card:hover{background:var(--hi);border-color:var(--green);transform:translateY(-2px);box-shadow:var(--glow)}
/* 图标方块：六边形能量块 + 青色描边发光（建筑 / 委托 / 技能的汉字图标都走这套） */
.card .ic{width:34px;height:34px;background:linear-gradient(160deg,rgba(90,210,255,.30),rgba(63,224,200,.16));
  color:#c9f6ff;display:grid;place-items:center;font-size:17px;font-weight:700;margin-bottom:6px;
  border:1px solid rgba(90,210,255,.45);box-shadow:0 0 12px rgba(90,210,255,.28);
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.card .tt{font-size:14px;font-weight:600}
.card .ct{font-size:11px;color:var(--dim);margin-top:2px}
.card .ct.no{color:var(--red)}
.card .ds{font-size:11px;color:#8a9690;margin-top:5px;line-height:1.5}

.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.item{display:flex;align-items:center;gap:7px;background:var(--surf);border:1px solid var(--bd);
  border-radius:3px;padding:7px 10px;font-size:13px;color:var(--ink)}
.item .sw{width:14px;height:14px;border-radius:2px;flex:0 0 14px;border:1px solid rgba(90,210,255,.35)}
.item .nm{flex:1}
.item b{color:var(--green2)}
.item.eat{cursor:pointer}
.item.eat:hover{background:var(--hi);border-color:var(--green)}
.item.on{border-color:var(--green);box-shadow:0 0 0 1px rgba(63,224,200,.45),var(--glow)}
.empty{color:var(--dim);font-size:13px;padding:10px 0}

.rows{display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:var(--surf);
  border:1px solid var(--bd);border-radius:3px;padding:7px 11px;font-size:12.5px;color:var(--dim)}
.row .tag{font-weight:700;color:var(--ink);min-width:78px}
.row b{color:var(--ink)}
.row .ok2{color:var(--green2);font-weight:700}
.prow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{cursor:pointer;border:1px solid var(--bd);background:var(--btnBg);border-radius:3px;padding:8px 16px;
  font-size:13px;color:var(--ink);transition:.15s;letter-spacing:.5px;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%)}
.btn:hover{background:var(--hi);border-color:var(--green);box-shadow:var(--glow)}
.btn.ok{background:linear-gradient(180deg,rgba(63,224,200,.32),rgba(63,224,200,.16));
  border-color:var(--green);color:#d6fff8;text-shadow:0 0 8px rgba(63,224,200,.6)}
.btn.ok:hover{background:linear-gradient(180deg,rgba(90,210,255,.38),rgba(90,210,255,.20));border-color:var(--green2)}
.btn.warn{background:rgba(255,107,122,.16);border-color:rgba(255,107,122,.5);color:#ffc4cb}
.pstat{margin-top:12px;font-size:12px;color:var(--dim);text-align:center}
.keys{display:flex;flex-direction:column;gap:5px;font-size:13px;color:#4a5a4e}
.keys b{display:inline-block;min-width:78px;color:var(--green2)}
.srow{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13px}
.srow span{width:66px;color:var(--dim)}
.srow input[type=range]{flex:1;accent-color:var(--green)}
.srow b{width:72px;text-align:right;font-size:12px;color:var(--ink)}
.tip{margin-top:10px;font-size:12px;color:var(--dim)}

/* ---------- 物品悬停信息面板 ---------- */
#tooltip{position:fixed;z-index:60;pointer-events:none;max-width:236px;
  background:rgba(28,40,30,.92);color:#f0f6ee;border:1px solid rgba(255,255,255,.14);
  border-radius:10px;padding:9px 12px;font-size:12px;line-height:1.55;
  box-shadow:0 8px 24px rgba(10,25,15,.4);opacity:0;transition:opacity .22s;}
#tooltip.show{opacity:1}
#tooltip .tp-n{font-size:13px;font-weight:700;color:#ffe9a0;margin-bottom:2px}
#tooltip .tp-n span{color:#b8e890;font-weight:600}
#tooltip .tp-d{color:#cfe0cc}
#tooltip .tp-p{margin-top:3px;color:#f0c840;font-size:11px}

/* ---------- 物品行小按钮 ---------- */
.item .mini{cursor:pointer;flex:0 0 auto;margin-left:4px;background:rgba(90,168,106,.14);
  border:1px solid var(--bd);border-radius:7px;padding:1px 7px;font-size:11px;color:var(--green2);transition:.12s}
.item .mini:hover{background:var(--green);color:#fff;border-color:var(--green)}

/* ---------- 设置：快捷键编辑 ---------- */
.keygrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 22px}
.keyrow{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px dashed rgba(60,80,60,.14)}
.keyrow>span{flex:0 0 82px;font-size:12px}
.keyrow input{flex:0 0 92px;text-align:center;padding:3px 6px;border:1px solid var(--bd);border-radius:3px;
  background:rgba(4,14,24,.85);color:#dff1ff;font-size:12px;font-family:inherit;pointer-events:auto}
.keyrow input.bad{border-color:var(--red);background:rgba(255,107,122,.12)}
.keyrow em{flex:1;font-size:11px;color:var(--red);font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 大地图 ---------- */
.bigmap{width:min(440px,80vw);height:min(440px,80vw);border-radius:12px;border:1px solid var(--bd);
  box-shadow:var(--sh);display:block;margin:0 auto}
#mm{cursor:pointer}

/* ---------- 目标血条 ---------- */
#targethp{position:absolute;left:50%;top:64px;transform:translateX(-50%);display:none;
  width:260px;background:rgba(20,26,22,.55);border:1px solid rgba(255,255,255,.14);
  border-radius:10px;padding:5px 10px;pointer-events:none}
#targethp .tn{font-size:12px;color:#ffe0b0;font-weight:700}
#targethp .tb{height:8px;margin:3px 0;background:rgba(0,0,0,.35);border-radius:5px;overflow:hidden}
#targethp .tb i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#e05a5a,#ff8a6a);transition:width .12s}
#targethp .th{font-size:11px;color:#e8f0e6;text-align:right}

/* ---------- 聊天窗（可拖拽 / 拉伸 / 关闭） ---------- */
.chatwin{position:fixed;right:18px;bottom:96px;width:390px;height:260px;display:none;flex-direction:column;
  background:rgba(24,32,26,.90);border:1px solid rgba(255,255,255,.14);border-radius:12px;
  box-shadow:0 14px 40px rgba(10,25,15,.45);z-index:55;backdrop-filter:blur(6px)}
.chatwin .cw-head{display:flex;align-items:center;gap:8px;padding:6px 8px;cursor:move;
  border-bottom:1px solid rgba(255,255,255,.10);user-select:none}
.chatwin .cw-title{font-size:13px;font-weight:700;color:#ffe9a0}
.chatwin .cw-tabs{display:flex;gap:4px;flex:1;overflow:hidden}
.chatwin .cw-tab{font-size:11px;padding:2px 7px;border-radius:7px;background:rgba(255,255,255,.08);
  color:#cfe0cc;cursor:pointer;white-space:nowrap}
.chatwin .cw-tab.on{background:var(--green);color:#fff}
.chatwin .cw-tab.new::after{content:'●';color:#f0c840;margin-left:3px;font-size:9px}
.chatwin .cw-btns span{cursor:pointer;padding:0 6px;color:#cfe0cc}
.chatwin .cw-body{flex:1;overflow-y:auto;padding:6px 9px;font-size:12px;line-height:1.6}
.chatwin .cw-msg{margin-bottom:2px;word-break:break-all}
.chatwin .cw-msg.sys{color:#ff9a8a}
.chatwin .cw-msg b{font-weight:600}
.chatwin .cw-input{display:flex;gap:6px;padding:6px;border-top:1px solid rgba(255,255,255,.10)}
.chatwin .cw-input input{flex:1;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.14);
  border-radius:8px;color:#eaf2e8;padding:4px 8px;font-size:12px}
.chatwin .cw-input button{background:var(--green);color:#fff;border:0;border-radius:8px;padding:4px 12px;font-size:12px;cursor:pointer}
.chatwin .cw-rs{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;
  background:linear-gradient(135deg,transparent 50%,rgba(255,255,255,.35) 50%)}

/* 聊天工具栏：表情 / 图片 / 照片 / 背包 / 仓库 */
.chatwin .cw-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:4px 8px;
  border-top:1px solid rgba(255,255,255,.10)}
.chatwin .cw-tool{display:flex;align-items:center;gap:3px;font-size:13px;padding:2px 7px;border-radius:8px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.10);cursor:pointer;user-select:none}
.chatwin .cw-tool:hover{background:rgba(90,168,106,.24);border-color:rgba(90,168,106,.5)}
.chatwin .cw-tool i{font-style:normal;font-size:11px;color:#cfe0cc}
.chatwin .cw-pop{position:absolute;left:8px;right:8px;bottom:66px;max-height:240px;overflow-y:auto;
  background:rgba(20,28,22,.97);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:7px;
  box-shadow:0 10px 26px rgba(0,0,0,.45);z-index:60}
.chatwin .cw-pop-t{font-size:11px;color:#8fe0a0;margin-bottom:5px}
.chatwin .cw-pop-tip{font-size:11px;color:#cfe0cc;margin-top:5px}
.chatwin .cw-emo{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
.chatwin .cw-e{font-size:17px;text-align:center;cursor:pointer;border-radius:6px;padding:1px 0}
.chatwin .cw-e:hover{background:rgba(255,255,255,.14)}
.chatwin .cw-ipick{display:flex;flex-direction:column;gap:3px}
.chatwin .cw-irow{display:flex;align-items:center;gap:6px;font-size:12px;padding:3px 6px;border-radius:7px;
  background:rgba(255,255,255,.05);cursor:pointer}
.chatwin .cw-irow:hover{background:rgba(90,168,106,.22)}
.chatwin .cw-irow .sw{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.chatwin .cw-irow .nm{flex:1;color:#eaf2e8}
.chatwin .cw-irow b{color:#f0c840;font-size:11px}
.chatwin .cw-img{display:block;max-width:160px;max-height:160px;border-radius:8px;margin:2px 0;cursor:zoom-in;
  border:1px solid rgba(255,255,255,.16)}
.chatwin .cw-chip{display:inline-flex;align-items:center;gap:5px;padding:1px 7px;border-radius:8px;cursor:pointer;
  background:rgba(240,200,64,.14);border:1px solid rgba(240,200,64,.34);font-size:12px;margin:1px 0}
.chatwin .cw-chip:hover{background:rgba(240,200,64,.28)}
.chatwin .cw-chip .sw{width:10px;height:10px;border-radius:3px}
.chatwin .cw-chip .nm{color:#ffe9a0;font-weight:600}
.chatwin .cw-chip b{color:#f0c840;font-size:11px}
.chatwin video#cw-vid{width:100%;max-height:150px;background:#000;border-radius:8px}
.cw-viewer{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.74);z-index:200;cursor:zoom-out}
.cw-viewer.show{display:flex}
.cw-viewer img{max-width:78vw;max-height:82vh;border-radius:10px;border:1px solid rgba(255,255,255,.2)}

/* ---------- 好友 / 队伍 / 拍卖 / 公会 ---------- */
.friends{display:flex;flex-direction:column;gap:4px;max-height:230px;overflow-y:auto}
.frow{display:flex;align-items:center;gap:8px;padding:5px 9px;border-radius:9px;
  background:rgba(255,255,255,.04);border:1px solid var(--bd);font-size:12px;cursor:default}
.frow.on{background:rgba(90,168,106,.10)}
.frow .dot{width:8px;height:8px;border-radius:50%}
.frow .fn{font-weight:700;color:#f2f6f0}
.frow .fj{color:var(--dim)}
.frow .fl{color:#f0c840}
.frow .fs{margin-left:auto;color:var(--dim)}
.ctxmenu{position:fixed;z-index:70;background:rgba(28,36,30,.96);border:1px solid rgba(255,255,255,.16);
  border-radius:9px;padding:4px;box-shadow:0 8px 22px rgba(0,0,0,.4);min-width:120px}
.ctxmenu .ctxitem{padding:6px 10px;font-size:12px;color:#eaf2e8;border-radius:7px;cursor:pointer}
.ctxmenu .ctxitem:hover{background:var(--green);color:#fff}
.gxp{display:flex;align-items:center;gap:8px;margin:6px 0}
.gxp-bar{flex:1;height:14px;background:rgba(0,0,0,.30);border-radius:8px;overflow:hidden}
.gxp-bar i{display:block;height:100%;background:linear-gradient(90deg,#5ac07a,#a8e890)}
.gxp-num{font-size:11px;color:#cfe0cc;white-space:nowrap}
.gxp-pct{font-size:12px;font-weight:700;color:#a8e890;white-space:nowrap}
.gnotice{width:100%;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.14);border-radius:9px;
  color:#eaf2e8;padding:6px 9px;font-size:12px;resize:vertical}
.ah{display:flex;flex-direction:column;gap:3px;max-height:290px;overflow-y:auto}
.ah-row{display:flex;align-items:center;gap:7px;padding:4px 8px;border-radius:9px;
  background:rgba(255,255,255,.04);border:1px solid var(--bd);font-size:12px;color:#eaf2e8}
.ah-row.mine{background:rgba(240,200,64,.10)}
.ah-row .sw{width:12px;height:12px;border-radius:3px;flex:0 0 auto}
.ah-row .ah-n{font-weight:700;min-width:78px;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.ah-row .ah-q{font-size:11px;padding:0 6px;border-radius:6px;background:rgba(0,0,0,.25)}
.ah-row .q-普通,.ah-row .qn-普通{color:#f2f6f0}
.ah-row .q-精良,.ah-row .qn-精良{color:#6ee082}
.ah-row .q-稀有,.ah-row .qn-稀有{color:#6ab4ff}
.ah-row .q-史诗,.ah-row .qn-史诗{color:#c993ff}
.ah-row .q-传说,.ah-row .qn-传说{color:#ffb648}
.ah-row .ah-c,.ah-row .ah-l,.ah-row .ah-c2{color:#cfe0cc;font-size:11px}
.ah-row .ah-p{color:#f5cf52;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.ah-row .ah-s{color:#c3d2c0;font-size:11px;margin-left:auto}
.ah-row .ah-b{color:#9ad0e8;font-size:11px}
.sold-sum{display:flex;flex-direction:column;align-items:flex-end;gap:2px;margin-top:8px;
  padding:8px 14px;border-radius:10px;background:rgba(240,200,64,.08);border:1px solid rgba(240,200,64,.28);
  font-size:12px;color:#eaf2e8}
.sold-sum .ss-row b{color:#f5cf52;font-weight:700}
.sold-sum .ss-net{border-top:1px dashed rgba(240,200,64,.35);margin-top:3px;padding-top:4px}
.sold-sum .ss-net b{color:#8ce8a0;font-size:14px}
.mini.buy{background:rgba(240,200,64,.18);color:#f0c840}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.filters input,.filters select{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.14);
  border-radius:8px;color:#eaf2e8;padding:4px 7px;font-size:12px}
/* ---------- 天气 HUD ---------- */
#weather{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:12px}
#weather .wx-ic{font-size:15px}
#weather .wx-n{font-weight:700;color:#eaf2e8}
#weather .wx-b{font-size:11px;padding:1px 6px;border-radius:7px;background:rgba(255,255,255,.08);border:1px solid var(--bd)}
#weather .wx-b.ok{color:#8ce8a0;background:rgba(90,192,122,.14)}
#weather .wx-b.no{color:#ffb0a0;background:rgba(200,90,70,.16)}

/* ---------- 斗兽场：观战 / 竞猜面板 ---------- */
.abet{position:fixed;right:18px;bottom:150px;width:430px;max-height:60vh;display:none;flex-direction:column;
  background:rgba(22,30,24,.96);border:1px solid rgba(255,255,255,.16);border-radius:12px;z-index:58;
  box-shadow:0 14px 38px rgba(10,25,15,.5);backdrop-filter:blur(6px)}
.abet .ab-head{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;
  border-bottom:1px solid rgba(255,255,255,.10);font-size:12px;font-weight:700;color:#ffe9a0}
.abet .ab-head #ab-x{cursor:pointer;color:#cfe0cc;padding:0 4px}
.abet .ab-body{overflow-y:auto;padding:8px 10px;font-size:12px}
.abet .ab-vs{display:grid;grid-template-columns:1fr 62px 1fr;gap:6px;align-items:start}
.abet .ab-side{padding:5px 7px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid var(--bd)}
.abet .ab-side.red{border-color:rgba(224,120,90,.45);background:rgba(224,120,90,.10)}
.abet .ab-side.blue{border-color:rgba(106,168,240,.45);background:rgba(106,168,240,.10)}
.abet .ab-st{font-weight:700;color:#eaf2e8;font-size:12px}
.abet .ab-sm{font-size:10px;color:#cfe0cc;margin-bottom:4px}
.abet .ab-pet{display:grid;grid-template-columns:1fr auto auto;gap:4px;align-items:center;
  padding:2px 4px;border-radius:6px;background:rgba(0,0,0,.18);margin-bottom:2px}
.abet .ab-pet.dead{opacity:.45}
.abet .ab-pet .pn{font-weight:600}
.abet .ab-pet .pl2{color:#f0c840;font-size:10px}
.abet .ab-pet .pp{color:#cfe0cc;font-size:10px}
.abet .ab-pet .pb{grid-column:1/4;height:4px;background:rgba(0,0,0,.3);border-radius:3px;overflow:hidden}
.abet .ab-pet .pb i{display:block;height:100%;background:linear-gradient(90deg,#5ac07a,#a8e890)}
.abet .ab-mid{display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:center}
.abet .ab-odd{text-align:center}
.abet .ab-odd b{display:block;font-size:15px;color:#f5cf52}
.abet .ab-odd span{font-size:10px;color:#cfe0cc}
.abet .ab-vstxt{font-size:11px;color:#ffe9a0;font-weight:800}
.abet .ab-pot{margin-top:6px;font-size:11px;color:#eaf2e8}
.abet .ab-betrow{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.abet .ab-bets{display:flex;gap:4px;flex-wrap:wrap}
.abet .ab-bets.red .mini{background:rgba(224,120,90,.22);color:#ffb0a0}
.abet .ab-bets.blue .mini{background:rgba(106,168,240,.22);color:#a8d0ff}
.abet .ab-log{margin-top:6px;font-size:11px;color:#cfe0cc;max-height:88px;overflow-y:auto;line-height:1.5}
.abet .ab-tip{margin-top:6px;font-size:11px;color:#8ce8a0}
.abet .ab-res{margin-top:6px;padding:4px 8px;border-radius:8px;font-weight:700;
  background:rgba(240,200,64,.16);color:#ffe9a0}
.abet .ab-foot{margin-top:6px;font-size:10px;color:#9fb09c;border-top:1px dashed rgba(255,255,255,.14);padding-top:4px}

/* ---------- 公告板 / 委托 / 黑市 ---------- */
.bd-card{position:relative;text-align:center;padding-top:18px}
.bd-card .bd-m{position:absolute;top:4px;right:6px;font-size:15px}
.bd-card.gold{border-color:rgba(240,200,64,.55);box-shadow:0 0 16px rgba(240,200,64,.18)}
.bd-card.silver{border-color:rgba(200,205,215,.45)}
.bd-card.bronze{border-color:rgba(200,140,90,.45)}
.bd-card .pl-av{width:44px;height:44px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;color:#14251a}
.bd-card .bd-score{font-weight:800;color:#ffe9a0}
.bd-bar{height:6px;margin-top:4px;background:rgba(0,0,0,.3);border-radius:4px;overflow:hidden}
.bd-bar i{display:block;height:100%;background:linear-gradient(90deg,#5ac07a,#a8e890)}
.qrow{align-items:flex-start}
.qrow .qgn{color:#f5cf52;font-size:11px}
.qrow .bd-bar{margin-bottom:4px}
.friends .frow.on{background:rgba(240,200,64,.12);border-color:rgba(240,200,64,.4)}
.sel,.inp{background:rgba(0,0,0,.28);border:1px solid var(--bd);color:#eaf2e8;border-radius:8px;padding:5px 8px;font-size:12px}
.inp{width:74px}

/* ---------- 排行榜 ---------- */
.ranktabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.ranktabs .rt{font-size:12px;padding:4px 10px;border-radius:3px;cursor:pointer;
  background:rgba(16,34,52,.6);border:1px solid var(--bd);color:#a9cfe4;font-weight:600;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%)}
.ranktabs .rt.on{background:linear-gradient(180deg,rgba(63,224,200,.32),rgba(63,224,200,.14));
  border-color:var(--green);color:#d6fff8;box-shadow:var(--glow)}
.rklist{display:flex;flex-direction:column;gap:3px;max-height:330px;overflow-y:auto}
.rk-row{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:9px;
  background:rgba(255,255,255,.04);border:1px solid var(--bd);font-size:12px;cursor:pointer;transition:.12s}
.rk-row:hover{background:rgba(90,168,106,.16)}
.rk-row.me{background:rgba(240,200,64,.14);border-color:rgba(240,200,64,.35)}
.rk-row.top .rk-n{color:#f0c840;font-weight:800}
.rk-row .rk-n{width:26px;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
.rk-row .rk-av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:12px;font-weight:700;flex:0 0 auto;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.rk-row .rk-name{font-weight:700;color:var(--ink);min-width:64px}
.rk-row .rk-job{color:var(--dim);font-size:11px}
.rk-row .rk-g{color:#8fc86a;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:96px}
.rk-row .rk-sc{margin-left:auto;color:#f0c840;font-weight:700;font-size:12px}
.rk-row .rk-d{width:42px;text-align:right;font-size:11px}
.rk-row .rk-d .up{color:#5ac07a;font-style:normal}
.rk-row .rk-d .dn{color:#e0785a;font-style:normal}
.rk-row .rk-d .eq{color:#8a9490;font-style:normal}

/* ---------- 玩家信息面板 ---------- */
.pl-head{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.pl-av{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:24px;font-weight:700;flex:0 0 auto;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.pl-meta .pl-name{font-size:15px;font-weight:800;color:var(--ink)}
.pl-meta .pl-job{font-size:11px;color:var(--dim);font-weight:400;margin-left:4px}
.pl-meta .pl-sub{font-size:11px;color:#cfe0cc;margin-top:2px}
.skillgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.skill{display:grid;grid-template-columns:26px 1fr auto;gap:6px;align-items:center;
  padding:5px 8px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid var(--bd);font-size:12px}
.skill .si{width:24px;height:24px;display:flex;align-items:center;justify-content:center;
  color:#04202a;font-weight:800;font-size:12px;border:1px solid rgba(255,255,255,.35);
  box-shadow:0 0 10px currentColor;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.skill .sn{color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(30,50,30,.65),0 0 1px rgba(30,50,30,.5)}
.skill .sl{color:#f0c840;font-weight:700}
.skill .sb{grid-column:1/4;height:6px;background:rgba(0,0,0,.30);border-radius:4px;overflow:hidden}
.skill .sb i{display:block;height:100%;background:linear-gradient(90deg,#5ac07a,#a8e890)}
.skill .sx{grid-column:1/4;font-size:10px;color:var(--dim);text-align:right}
.toolgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 4px;border-radius:9px;
  background:rgba(255,255,255,.04);border:1px solid var(--bd);font-size:11px;cursor:help}
.tool .ti{width:22px;height:22px;border-radius:6px;background:rgba(200,168,106,.20);color:#f0d8a0;
  display:flex;align-items:center;justify-content:center;font-weight:700}
.tool .tn2{color:#eaf2e8}
.tool .tl{color:#f0c840;font-weight:700}
.tool .tb2{width:100%;height:5px;background:rgba(0,0,0,.30);border-radius:4px;overflow:hidden}
.tool .tb2 i{display:block;height:100%;background:linear-gradient(90deg,#6aa8f0,#9ad0f8)}

.floors{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.floors .floor{position:relative;padding:8px 4px;border-radius:10px;border:1px solid var(--bd);
  background:rgba(255,255,255,.05);text-align:center;cursor:pointer;transition:.12s}
.floors .floor:hover{background:rgba(90,168,106,.18);transform:translateY(-1px)}
.floors .floor b{display:block;font-size:15px;color:#ffe9a0}
.floors .floor span{display:block;font-size:10px;color:var(--dim)}
.floors .floor i{display:block;font-size:10px;color:#e05a5a;font-style:normal;min-height:12px}
.floors .floor.boss{border-color:rgba(224,90,90,.5);background:rgba(224,90,90,.10)}

/* ---------- 加载 ---------- */
#loading{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;
  background:radial-gradient(120% 90% at 50% 0%,#0d2438 0%,#06111d 55%,#03080f 100%);color:#dff1ff}
#loading h1{font-size:26px;letter-spacing:6px;font-weight:700;color:#e6f7ff;text-shadow:0 0 22px rgba(90,210,255,.6)}
#loading .sub{font-size:13px;opacity:.8;letter-spacing:3px;color:#8fb0c4}
#lbar{width:min(360px,72vw);height:8px;border-radius:2px;background:rgba(90,210,255,.14);overflow:hidden;
  border:1px solid var(--bd)}
#lbar i{display:block;height:100%;width:12%;background:linear-gradient(90deg,#5ad2ff,#3fe0c8);
  box-shadow:0 0 12px rgba(90,210,255,.7);transition:width .25s}
#ltip{font-size:12px;opacity:.8}
</style>
