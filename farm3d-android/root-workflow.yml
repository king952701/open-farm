# =============================================================================
# 牧野田园 APK 构建（GitHub Actions）
#
# 【放置位置】本文件需要放在「仓库根目录」的 .github/workflows/ 下才能被识别：
#     <repo>/.github/workflows/build-farm3d-apk.yml
# 推上去之前请把本文件从 farm3d-android/root-workflow.yml 复制过去。
#
# 【触发】推送 farm3d/**（游戏源码）或 farm3d-android/**（壳工程）时自动编译；
#         也可在 Actions 页面手动点击「Run workflow」。
# 【产物】牧野田园-APK：debug 与 release 两个包（release 用 debug 签名，可直接安装）
# =============================================================================
name: 构建牧野田园 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'farm3d/**'
      - 'farm3d-android/**'
      - '.github/workflows/build-farm3d-apk.yml'

jobs:
  build:
    name: 编译 APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android：它会去装已废弃的 tools 包而失败。
      # GitHub runner 镜像自带 /usr/local/lib/android/sdk，这里只补 cmdline-tools + 组件。
      - name: 安装 Android SDK
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          sudo mkdir -p "$ANDROID_HOME"
          sudo chown -R "$USER" "$ANDROID_HOME"
          if [ ! -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "downloading cmdline-tools ..."
            curl -sSL -o /tmp/cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p /tmp/cmdt "$ANDROID_HOME/cmdline-tools/latest"
            unzip -q -o /tmp/cmdtools.zip -d /tmp/cmdt
            cp -r /tmp/cmdt/cmdline-tools/. "$ANDROID_HOME/cmdline-tools/latest/"
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          sdkmanager --list_installed
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # prepare.js：把 farm3d/ 同步成纯 Web 资源，并生成注入触控层的移动入口 m.html
      - name: 同步网页资源到 assets
        run: node farm3d-android/scripts/prepare.js

      - name: 安装 Gradle 8.5
        run: |
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.5/bin" >> "$GITHUB_PATH"

      - name: 编译
        run: gradle -p farm3d-android assembleRelease assembleDebug --no-daemon

      - name: 列出产物
        run: find farm3d-android/app/build/outputs/apk -name '*.apk'

      - name: 上传 APK（Actions 产物）
        uses: actions/upload-artifact@v4
        with:
          name: 牧野田园-APK
          path: farm3d-android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  # 发一个 Release：拿到可以直接分享给别人下载的固定链接
  #   https://github.com/<owner>/<repo>/releases/latest/download/牧野田园-1.0.0.apk
  release:
    name: 发布下载
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps
      - name: 下载 APK
        uses: actions/download-artifact@v4
        with:
          name: 牧野田园-APK
          path: apk

      - name: 整理文件名
        run: |
          mkdir -p out
          find apk -name '*.apk' -exec cp {} out/ \;
          ls -lh out

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 牧野田园 v1.0.${{ github.run_number }}
          body: |
            安卓安装包（自动构建）。

            - `app-release.apk`：正式包，可直接安装
            - `app-debug.apk`：调试包（可开 Chrome 远程调试）

            安装时若提示「未知来源」，允许即可 —— 用 debug 签名，未上架商店。
          files: out/**/*.apk
          make_latest: true
